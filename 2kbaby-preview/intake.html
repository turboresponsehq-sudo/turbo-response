<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2K Baby | Booking & Collaboration</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:white;font-family:Inter,Arial,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:20px 6%;border-bottom:1px solid #273241}a{color:#caff08;text-decoration:none;font-weight:800}.logo{font:900 36px 'Barlow Condensed';color:white}main{max-width:720px;margin:55px auto;padding:0 20px}.tag{color:#caff08;letter-spacing:.17em;font-size:12px;font-weight:800}h1{font:900 clamp(58px,12vw,100px)/.85 'Barlow Condensed';margin:15px 0}p{color:#b9c5d0;line-height:1.6}.form{background:#101b28;border:1px solid #34465b;border-radius:14px;padding:25px;margin:25px 0 50px}label{display:block;font-weight:800;font-size:12px;letter-spacing:.06em;margin:18px 0}input,select,textarea{display:block;margin-top:8px;width:100%;padding:15px;border-radius:8px;border:1px solid #42566c;background:#1b2b3d;color:white;font:500 15px Inter,Arial}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 15px}button{border:0;border-radius:35px;background:#caff08;color:#111;padding:17px 26px;font-weight:900;cursor:pointer}small{display:block;color:#aab9c8;margin-top:18px;line-height:1.5}@media(max-width:600px){.grid{grid-template-columns:1fr}.form{padding:18px}main{margin-top:35px}}</style></head><body><header><a class="logo" href="./">2KBABY</a><a href="./">← BACK TO WEBSITE</a></header><main><div class="tag">BOOKINGS · COLLABORATIONS · PARTNERSHIPS</div><h1>LET'S CONNECT.</h1><p>Tell us a little about your opportunity. This is a preview of the artist inquiry experience.</p><form class="form" id="intake"><div class="grid"><label>YOUR NAME<input name="name" placeholder="Full name" autocomplete="name" required></label><label>EMAIL<input name="email" type="email" placeholder="Email address" autocomplete="email" required></label></div><label>WHAT ARE YOU INTERESTED IN?<select name="type" required><option value="">Choose one</option><option>Book a show / performance</option><option>College / campus appearance</option><option>Music collaboration</option><option>Brand / fashion collaboration</option><option>Interview / press</option><option>Other inquiry</option></select></label><label>TELL US ABOUT IT<textarea name="details" rows="4" placeholder="City, date, idea or event details" required></textarea></label><button type="submit">PREPARE REQUEST →</button><small id="status" role="status">Presentation demo: prepares an email draft. No information is saved or sent to a server.</small></form></main><script>document.getElementById('intake').addEventListener('submit',function(e){e.preventDefault();const d=new FormData(this);const subject=encodeURIComponent('2K Baby — '+d.get('type'));const body=encodeURIComponent('Name: '+d.get('name')+'\nEmail: '+d.get('email')+'\nInquiry: '+d.get('type')+'\nDetails: '+d.get('details'));document.getElementById('status').textContent='Opening a draft in your email app. Choose a recipient before sending. No request has been submitted to the website.';location.href='mailto:?subject='+subject+'&body='+body})</script></body></html>
