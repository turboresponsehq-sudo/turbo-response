<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2K Baby | Booking & Collaboration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--pink:#f51a87;--ink:#090511;--panel:#170b1e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#451535,#090511 52%);color:#fff;font-family:Inter,Arial,sans-serif}a{color:#fff;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 6%;border-bottom:2px solid var(--pink);background:#08050ce8}.logo{font:italic 900 40px 'Barlow Condensed';text-shadow:3px 3px #000,5px 5px var(--pink)}.back{font-weight:800}.wrap{max-width:780px;margin:56px auto;padding:0 20px}.eyebrow{color:#ff72b8;font:italic 900 14px 'Barlow Condensed';letter-spacing:.18em}h1{font:italic 900 clamp(65px,12vw,112px)/.82 'Barlow Condensed';margin:15px 0;text-shadow:4px 4px #000,7px 7px var(--pink)}p{color:#ead9e7;line-height:1.65}.form{margin-top:28px;padding:26px;border:2px solid var(--pink);background:linear-gradient(120deg,#260b2c,#100817);box-shadow:0 14px 50px #0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}label{display:block;margin:18px 0;font-size:12px;font-weight:800;letter-spacing:.08em}input,select,textarea{display:block;width:100%;margin-top:8px;padding:14px;border:1px solid #bd5a91;border-radius:7px;background:#0c0711;color:#fff;font:500 15px Inter,Arial}button{border:2px solid #ffd7ed;border-radius:7px;padding:14px 22px;background:linear-gradient(#ff37a0,#e9006b);color:#fff;box-shadow:0 5px 0 #650a42;font:italic 900 20px 'Barlow Condensed';cursor:pointer}small{display:block;margin-top:18px;color:#cbb4c7;line-height:1.5}@media(max-width:600px){.top{padding:16px 5%}.logo{font-size:32px}.back{font-size:12px}.wrap{margin-top:35px}.grid{grid-template-columns:1fr}.form{padding:18px}}
  </style>
</head>
<body>
  <header class="top"><a class="logo" href="./">2K Baby</a><a class="back" href="./">← Back to website</a></header>
  <main class="wrap"><div class="eyebrow">Bookings · Collaborations · Partnerships</div><h1>Let's connect.</h1><p>Tell the team about a performance, appearance, music feature, press request or brand opportunity.</p>
    <form class="form" id="intake"><div class="grid"><label>Your name<input name="name" placeholder="Full name" autocomplete="name" required /></label><label>Email<input name="email" type="email" placeholder="Email address" autocomplete="email" required /></label></div><label>What are you interested in?<select name="type" required><option value="">Choose one</option><option>Book a show / performance</option><option>College / campus appearance</option><option>Music collaboration</option><option>Brand / fashion collaboration</option><option>Interview / press</option><option>Other inquiry</option></select></label><label>Tell us about it<textarea name="details" rows="5" placeholder="City, date, idea or event details" required></textarea></label><button type="submit">Open email request →</button><small id="status" role="status">Booking inquiries open a prefilled email to the 2KBABY team. Nothing is saved or sent automatically.</small></form>
  </main>
  <script>document.querySelector('#intake').addEventListener('submit',function(event){event.preventDefault();const data=new FormData(this);const subject=encodeURIComponent('2K Baby — '+data.get('type'));const body=encodeURIComponent('Name: '+data.get('name')+'\nEmail: '+data.get('email')+'\nInquiry: '+data.get('type')+'\nDetails: '+data.get('details'));document.querySelector('#status').textContent='Opening a prefilled email addressed to the 2KBABY team. Send it in your email app to submit the request.';location.href='mailto:connect@realchillmarketing.com?subject='+subject+'&body='+body});</script>
</body>
</html>
