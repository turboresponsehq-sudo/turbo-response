<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>ATL 1996 | XR Preview</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;background:#080b14;font-family:Arial,sans-serif}.hud{position:fixed;z-index:10;top:14px;left:14px;color:white;background:#10131bbd;border:1px solid #ffffff44;border-radius:12px;padding:12px;max-width:265px}.hud h1{margin:0;font-size:21px;color:#ffb768}.hud p{font-size:12px;line-height:1.5;margin:6px 0 0}.bottom{position:fixed;z-index:10;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}button{background:#c33925;color:white;border:0;border-radius:20px;padding:12px;font-weight:bold;white-space:nowrap}#story{position:fixed;z-index:12;bottom:75px;left:15px;right:15px;background:#141722e8;color:white;border-radius:12px;padding:12px;display:none;font-size:14px}</style></head><body><div class="hud"><h1>ATL 1996</h1><p>Interactive concept preview · Drag to look around on your phone. Tap glowing markers to explore. This is a stylized prototype, not a historical reconstruction.</p></div><div id="story"></div><div class="bottom"><button onclick="go('street')">Atlanta Street</button><button onclick="go('studio')">The Studio</button><button onclick="go('future')">The Future</button></div><a-scene renderer="antialias:true; colorManagement:true" vr-mode-ui="enabled:true" background="color:#df9a7b"><a-entity id="rig" position="0 1.6 5"><a-camera look-controls wasd-controls="enabled:false"><a-cursor fuse="false" raycaster="objects:.hotspot" color="#ffffff" opacity=".7"></a-cursor></a-camera></a-entity><a-entity id="world"></a-entity><a-light type="ambient" intensity=".9"></a-light><a-light type="directional" position="-3 8 5" intensity="1.1" color="#ffd8a6"></a-light></a-scene><script>
const w=document.querySelector('#world'), story=document.querySelector('#story');
function el(tag,attrs,parent=w){let x=document.createElement(tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);parent.appendChild(x);return x}
function box(x,y,z,width,height,depth,color){return el('a-box',{position:x+' '+y+' '+z,width,height,depth,color})}
function label(txt,x,y,z,color='#ffffff'){return el('a-text',{value:txt,position:x+' '+y+' '+z,align:'center',width:5,color})}
function marker(txt,x,y,z,msg){let a=el('a-sphere',{position:x+' '+y+' '+z,radius:.28,color:'#ffcf54',class:'hotspot',animation:'property:scale;dir:alternate;dur:900;loop:true;to:1.18 1.18 1.18'});a.addEventListener('click',()=>{story.textContent=msg;story.style.display='block'});label(txt,x,y+.48,z,'#fff')}
function go(mode){w.innerHTML='';story.style.display='none';document.querySelector('a-scene').setAttribute('background','color:'+(mode==='street'?'#dba080':mode==='studio'?'#1c152b':'#080c27'));if(mode==='street'){box(0,-.12,-15,12,.15,55,'#45454b');box(-5,-.03,-15,3,.16,55,'#9d8b78');box(5,-.03,-15,3,.16,55,'#9d8b78');for(let i=0;i<8;i++){let z=2-i*6;box(-8,3,z,5,6,5,i%2?'#8c4939':'#a66d52');box(8,3,z,5,6,5,i%2?'#7b5447':'#a87455');for(let j=0;j<3;j++){box(-5.45,2+j*1.3,z, .08,.8,.7,'#a4c6ce');box(5.45,2+j*1.3,z,.08,.8,.7,'#a4c6ce')}}box(1,.6,-10,1.8,1.1,3.4,'#384a6c');box(-1,.6,-24,1.7,1.1,3.2,'#b2a58d');label('ATLANTA • 1996',0,5,-12,'#ffdf9d');marker('RECORD SHOP',-4,1.8,-6,'Imagine stepping into a 1996 Atlanta record store to discover the rise of Southern hip-hop.');marker('STREET STORY',2,1.8,-12,'A future version will feature historically researched Atlanta streets, archival stories, and ambient city sounds.')}else if(mode==='studio'){box(0,-.2,-6,22,.3,22,'#372c2c');box(0,4,-16,22,8,.3,'#302337');box(-10,4,-6,.3,8,22,'#392b3c');box(10,4,-6,.3,8,22,'#392b3c');box(0,1,-5,7,1.2,2,'#54423b');for(let i=0;i<12;i++)box(-2.9+i*.53,1.65,-4.8,.35,.08,.7,i%2?'#adb6b8':'#2b3338');box(-4,2,-8,2,3,1,'#191923');box(4,2,-8,2,3,1,'#191923');label('THE STUDIO',0,5,-10,'#ffdf9d');marker('MIXING DESK',0,2.4,-5,'Explore the instruments, mixing desks, and production culture that helped shape Atlanta music.')}else{el('a-sphere',{position:'0 1 -16',radius:6,color:'#25266b',material:'metalness:.4;roughness:.25'});for(let i=0;i<22;i++){let a=i*2.4;el('a-sphere',{position:(Math.sin(a)*12)+' '+(Math.cos(a)*5+3)+' '+(-14+Math.cos(a)*8),radius:.12,color:i%2?'#e75bd5':'#66eaff'})}el('a-torus',{position:'0 2 -9',radius:4,'radius-tubular':.13,color:'#3cf2db',rotation:'70 0 0',animation:'property:rotation;to:70 360 0;dur:16000;loop:true;easing:linear'});label('THE FUTURE',0,5,-8,'#8df7ff');marker('PORTAL',0,2,-6,'The final scene imagines Atlanta hip-hop reaching far beyond the city, into a futuristic universe.')}}go('street');</script></body></html>
