<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>ATL 1998 — The Ride | XR Concept</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0e;color:white;font-family:system-ui,Arial,sans-serif}.top{position:fixed;z-index:9;left:0;top:0;width:100%;padding:18px 17px 28px;background:linear-gradient(#0b0a11dc,transparent);pointer-events:none}.eyebrow{font-size:10px;letter-spacing:3px;color:#ffc184;font-weight:800}.title{font-size:clamp(25px,7vw,46px);font-weight:1000;line-height:1;letter-spacing:-1px;text-shadow:0 2px 18px #000}.title em{color:#ff5c42;font-style:italic}.desc{font-size:12px;color:#e8d4c6;margin-top:7px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:30px 14px 18px;background:linear-gradient(transparent,#08070af2);display:flex;gap:8px;align-items:center;justify-content:center}.bottom button{background:#c53829;border:1px solid #ff8d66;color:white;border-radius:25px;padding:13px 16px;font-weight:800;font-size:12px;box-shadow:0 5px 20px #0008}.bottom button.secondary{background:#191923c9;border-color:#ffffff60}.hint{position:fixed;z-index:8;top:27%;right:14px;background:#0c0b12b0;border:1px solid #ffffff30;border-radius:12px;padding:9px 12px;font-size:11px;color:#fff;pointer-events:none}.credits{position:fixed;bottom:78px;left:15px;right:15px;z-index:9;text-align:center;font-size:11px;color:#f3d2b9;text-shadow:0 2px 8px #000}.bar{position:fixed;z-index:9;top:14px;right:14px;color:#fff;background:#d4442b;padding:7px 9px;border-radius:5px;font-size:9px;font-weight:900;letter-spacing:1px}a-scene{height:100vh;width:100vw}</style></head><body><div class="top"><div class="eyebrow">THE STORY OF ATLANTA • XR CONCEPT</div><div class="title">ATL <em>1998</em><br>THE RIDE</div><div class="desc">Back seat. Drop-top. A city that made history.</div></div><div class="bar">INTERACTIVE PREVIEW</div><div class="hint">↔ Swipe to look around</div><div class="credits" id="status">Original demo audio only • Fictional placeholder passengers • Not an OutKast recording</div><div class="bottom"><button id="ride">▶ START THE RIDE</button><button class="secondary" id="sound">♫ SOUND OFF</button><button class="secondary" id="reset">↺ RESET VIEW</button></div><a-scene embedded vr-mode-ui="enabled:true" renderer="antialias:true;colorManagement:true" background="color:#b67e7d"><a-entity id="cam" position="0 1.7 0"><a-camera look-controls="touchEnabled:true;mouseEnabled:true" wasd-controls="enabled:false" fov="85"></a-camera></a-entity><a-entity id="world"></a-entity><a-light type="ambient" intensity="1.25" color="#ffe3c5"></a-light><a-light type="directional" position="-7 14 -16" intensity="1.4" color="#ffc78c"></a-light></a-scene><script>
const world=document.querySelector('#world');let riding=false,elapsed=0,last=0,audio=null,playing=false,objects=[];
function add(tag,attrs,parent=world){let x=document.createElement(tag);for(let [k,v] of Object.entries(attrs))x.setAttribute(k,v);parent.appendChild(x);return x}
function b(x,y,z,w,h,d,c,extra={},parent=world){return add('a-box',{position:[x,y,z].join(' '),width:w,height:h,depth:d,color:c,...extra},parent)}
function cyl(x,y,z,r,h,c){return add('a-cylinder',{position:[x,y,z].join(' '),radius:r,height:h,color:c})}
function text(t,x,y,z,size=1,c='#fff',rot='0 0 0'){return add('a-text',{value:t,position:[x,y,z].join(' '),width:size*5,align:'center',color:c,rotation:rot,'font':'mozillavr'})}
function cityBlock(side,z,n){let x=side*13;let col=['#8b493a','#ae7053','#674d51','#c29a73','#76595c'][n%5];let h=6+(n%4)*1.5;let root=add('a-entity',{position:'0 0 '+z});b(x,h/2,0,8,h,8,col,{},root);for(let floor=1;floor<h/1.8;floor++){for(let k=-1;k<=1;k++){b(x-side*4.04, floor*1.7, k*2.2, .12,.9,1.15,'#252e3a',{},root);b(x-side*4.12,floor*1.7,k*2.2,.04,.5,.7,'#8fb0b7',{},root)}}b(side*7.1,.15,0,3,.3,9,'#b7a38b',{},root);let pole=b(side*6.2,3.3,1,.12,6.6,.12,'#3c3535',{},root);objects.push({root,z,kind:'block'});return root}
function makeCar(){let c=add('a-entity',{id:'car'});b(0,.17,-.7,4.8,.25,5.2,'#6d171b');b(0,.6,1.65,4.6,1.2,.65,'#701e24');b(0,.98,1.33,4.45,.8,.28,'#8e2d2b');b(-2.25,.48,-.65,.2,.8,4.3,'#8a2328');b(2.25,.48,-.65,.2,.8,4.3,'#8a2328');b(0,.3,-2.7,4.7,.7,.45,'#8d2426');b(0,.72,-2.45,4.6,.12,.4,'#c6a273');b(0,.78,-2.15,4.2,.18,1,'#563a2c');b(0,.8,-2.55,4.7,.09,.09,'#d9c4a0');for(let s of [-1,1]){b(s*1.15,1.15,-1.85,1.15,1.3,.42,'#68252b');add('a-sphere',{position:s*1.15+' 2.05 -1.85',radius:.32,color:'#5b392c'},c);b(s*1.15,1.4,-1.82,.85,.9,.65,s===-1?'#283143':'#352a2b');b(s*1.15,1.07,-1.55,1.2,.23,.4,'#6e2427');}b(0,.83,-1.85,.15,1.4,.15,'#a97f5b');b(0,1.47,-2.4,4.4,.1,.1,'#c9bda4');b(-2.2,1.13,-2.4,.09,.7,.09,'#c9bda4');b(2.2,1.13,-2.4,.09,.7,.09,'#c9bda4');text('ATL 1998',0,.98,-2.37,.42,'#f2cb91');return c}
function build(){world.innerHTML='';objects=[];add('a-sky',{color:'#b9879c'});add('a-sphere',{position:'-18 13 -52',radius:5,color:'#ffdfaa',material:'shader:flat;opacity:.85'});b(0,-.3,-60,12,.4,260,'#3e3941');b(-7,-.25,-60,2,.35,260,'#aaa08f');b(7,-.25,-60,2,.35,260,'#aaa08f');for(let i=0;i<25;i++){let z=-i*12-8;let lane=b(0,-.07,z,.18,.03,5,'#e5c48b');objects.push({root:lane,z,kind:'lane'});for(let side of [-1,1])cityBlock(side,z,i+side+2)}for(let i=0;i<12;i++){let x=(i%2?-1:1)*(2+(i%3)*1.3),z=-15-i*23;let v=add('a-entity',{position:x+' 0 '+z});b(0,.5,0,1.6,.75,3,i%3?'#283e55':'#b5aa91',{},v);b(0,1,0,1.3,.3,1.8,'#34434a',{},v);for(let q of [-1,1]){cyl(q*.7,.2,-.9,.26,.15,'#19191e');cyl(q*.7,.2,.9,.26,.15,'#19191e')}objects.push({root:v,z,kind:'traffic'})}for(let i=0;i<10;i++){let z=-120-i*8; b((i%2?1:-1)*(3+i%3),5,z,3,10,3,'#62627b')}makeCar();text('THE CITY THAT MADE THE SOUND',0,8,-45,3,'#ffe2ac')}
function frame(now){let dt=Math.min((now-last)/1000||0,.06);last=now;if(riding){elapsed+=dt;for(let o of objects){o.z+=dt*12;if(o.z>16)o.z-=o.kind==='lane'?300:o.kind==='traffic'?280:300;o.root.setAttribute('position',o.kind==='block'?'0 0 '+o.z:o.kind==='lane'?'0 -.07 '+o.z:o.root.getAttribute('position').x+' 0 '+o.z)}document.querySelector('#car')?.setAttribute('rotation','0 0 '+(Math.sin(elapsed*2)*.13));}requestAnimationFrame(frame)}
function soundStart(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();let master=audio.createGain();master.gain.value=.07;master.connect(audio.destination);let osc=audio.createOscillator();osc.type='sawtooth';osc.frequency.value=52;let filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=125;osc.connect(filter);filter.connect(master);osc.start();let step=0;window.setInterval(()=>{if(!audio||!playing)return;let t=audio.currentTime;let o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=[55,55,65.4,49][step%4];g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);step++},400)}
document.getElementById('ride').onclick=()=>{riding=!riding;document.getElementById('ride').textContent=riding?'Ⅱ PAUSE RIDE':'▶ START THE RIDE';if(riding&&!audio){soundStart();playing=true;document.getElementById('sound').textContent='♫ SOUND ON'}};
document.getElementById('sound').onclick=()=>{if(!audio)soundStart();playing=!playing;audio.resume();audio.destination.channelCount=2;document.getElementById('sound').textContent=playing?'♫ SOUND ON':'♫ SOUND OFF'};
document.getElementById('reset').onclick=()=>{document.querySelector('[look-controls]')?.components['look-controls']?.resetPose();};
build();requestAnimationFrame(frame);
</script></body></html>
