name: Security Regression Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript typecheck (no allowlist)
        run: pnpm run check
      - name: Authentication security regression tests
        run: pnpm exec vitest run server/routes/auth.security.test.ts server/_core/index.security.test.ts
      - name: Production build
        run: pnpm run build
