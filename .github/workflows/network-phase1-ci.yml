name: Network Phase 1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - "client/src/App.tsx"
      - "client/src/features/creator/**"
      - "server/modules/creator/routes.ts"
      - "migrations/0024_create_zakhy_network_crm_phase1*"
      - ".github/workflows/network-phase1-ci.yml"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
