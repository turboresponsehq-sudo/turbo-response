name: Network Phase 1 CI

on:
  pull_request:
    branches: [main]
    paths:
      - "client/src/App.tsx"
      - "client/src/features/creator/**"
      - "server/modules/creator/routes.ts"
      - "migrations/0024_create_zakhy_network_crm_phase1*"
      - ".github/workflows/network-phase1-ci.yml"

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check (baseline-aware)
        shell: bash
        run: |
          set +e
          pnpm run check 2>&1 | tee /tmp/tsc.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          errors="$(grep 'error TS' /tmp/tsc.log || true)"
          unexpected="$(printf '%s\n' "$errors" | grep -v -E 'server/modules/creator/creatorWorkspaceRoutes.ts\(16,42\): error TS2345|server/modules/creator/routes.ts\(552,23\): error TS2769' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected TypeScript errors:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          echo "Only the two pre-existing baseline TypeScript errors remain; no Phase 1 errors detected."
      - run: pnpm run build
