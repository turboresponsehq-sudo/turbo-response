name: Business Intelligence + Operations System

on:
  schedule:
    # Daily workflow: 6:00am ET = 11:00am UTC (runs scan → tasks in sequence)
    - cron: "0 11 * * *"
    # Weekly Review: Sunday 8:00pm ET = Monday 1:00am UTC
    - cron: "0 1 * * 1"

  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        type: choice
        options:
          - daily-scan
          - daily-tasks
          - weekly-review
          - all-daily

permissions:
  contents: write
  issues: write

env:
  NODE_VERSION: "20"

jobs:
  # Job 1: Daily Intel Scan (6:00am ET)
  daily-intel-scan:
    name: Daily Intel Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.job == 'daily-scan' || github.event.inputs.job == 'all-daily'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run intel scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node daily-intel-scanner.js

      - name: Commit intel report
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/intel-reports/
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Daily intel report - $(date -u +%Y-%m-%d)"
          git push

  # Job 2: Daily Task Creation (runs after the intelligence scan)
  daily-task-creation:
    name: Daily Task Creation
    runs-on: ubuntu-latest
    needs: daily-intel-scan
    if: github.event_name == 'schedule' || github.event.inputs.job == 'daily-tasks' || github.event.inputs.job == 'all-daily'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main # ← FIX: Pull latest commit from main branch

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create GitHub issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node daily-task-creator.js

      - name: Create failure issue if task creation failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Daily Task Creation Failed - ${date}`,
              body: `Task creation job failed on ${date}.\n\n**Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['bug', 'task-creation']
            });

  # Job 3: Weekly Review (Sunday 8:00pm ET) - separate schedule
  weekly-review:
    name: Weekly Review
    runs-on: ubuntu-latest
    if: (github.event_name == 'schedule' && github.event.schedule == '0 1 * * 1') || github.event.inputs.job == 'weekly-review'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate weekly review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node weekly-review-generator.js

      - name: Commit weekly review
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/weekly-reviews/
          git diff --quiet && git diff --staged --quiet || git commit -m "📈 Weekly review - $(date -u +%Y-%m-%d)"
          git push
